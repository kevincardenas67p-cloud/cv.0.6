
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de fecha</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="calendario">

        <h2>Selecciona una fecha</h2>

        <div class="mes">
            <span>&lt;</span>
            <h3>Octubre 2026</h3>
            <span>&gt;</span>
        </div>

        <div class="dias">
            <div>Lun</div>
            <div>Mar</div>
            <div>Mié</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sáb</div>
            <div>Dom</div>
        </div>

        <div class="fechas">
            <div class="vacio"></div>
            <div class="vacio"></div>
            <div class="vacio"></div>
            <div class="vacio"></div>
            <div class="vacio"></div>
            <div class="vacio"></div>
            <div>1</div>

            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>

            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
            <div>13</div>
            <div>14</div>
            <div>15</div>

            <div>16</div>
            <div>17</div>
            <div class="seleccionado">18</div>
            <div>19</div>
            <div>20</div>
            <div>21</div>
            <div>22</div>

            <div>23</div>
            <div>24</div>
            <div>25</div>
            <div>26</div>
            <div>27</div>
            <div>28</div>
            <div>29</div>

            <div>30</div>
            <div>31</div>
        </div>

        <div class="pie">
            <p>Fecha seleccionada: 18 de octubre de 2026</p>
            <button>Cancelar</button>
            <button class="aceptar">Aceptar</button>
        </div>

    </div>

</body>
</html>
